name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }} # Не забудь создать токен в Settings -> Secrets

          # Основные настройки стиля (Claude AI Palette)
          config_timezone: Europe/Moscow
          config_order: base.header, languages, achievements, isocalendar
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Цвета (Пастельный хай-тек)
          config_theme: light
          config_colors: |
            {
              "background": "#FAF8F5",
              "text": "#2D2A26",
              "title": "#B08D6A",
              "icon": "#B08D6A"
            }

          # ПЛАГИН: Языки (Твои "Сферы")
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes # Глубокий анализ (для Java/Go/Python)
          plugin_languages_limit: 8

          # ПЛАГИН: Достижения (Achievements)
          plugin_achievements: yes
          plugin_achievements_display: compact # Компактно и стильно
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes

          # ПЛАГИН: Изометрический календарь (Хай-тек пульс)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

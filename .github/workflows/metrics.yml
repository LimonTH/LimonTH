name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          config_timezone: Europe/Moscow
          config_order: base.header, languages, achievements, isocalendar
          template: classic
          base: header, activity, community, repositories, metadata
          
          extras_css: |
            :root {
              --color-background: #FAF8F5;
              --color-text: #2D2A26;
              --color-title: #B08D6A;
              --color-icon: #B08D6A;
            }
          
          # Плагины
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          
          plugin_achievements: yes
          plugin_achievements_only: polyglot, stargazer, sponsor, deployer, member, maintainer, developer, scripter, packager, explorer, infographile
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
